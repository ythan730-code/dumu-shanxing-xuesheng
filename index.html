<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#29362f"><title>入畫｜尋回古人的記憶</title><link rel="stylesheet" href="./ruhua/style.css?v=20261119-student-flow"><style>.score-card .classdojo-reward{margin:10px 0 0;color:#ffe1a0;font:700 clamp(26px,4vw,36px)/1.3 system-ui,sans-serif;overflow-wrap:anywhere}</style></head><body>
<header><div id="brand"><strong>入畫</strong><span>尋回古人的記憶</span></div><nav aria-label="工具"><button data-modal="poem">讀詩</button><button data-modal="journal">尋憶手記</button><button data-modal="help">玩法</button></nav></header>
<main id="main"><section id="landscape" aria-label="可移動觀看的水彩秋山"><div id="world"></div><div class="scene-top"><span>第一章・秋山歸憶</span><span id="progress"></span><span id="score-badge" role="status" aria-live="polite" hidden></span></div><div id="intro-art" hidden></div><div id="home" hidden></div><div class="scene-bottom"><p id="scene-status" role="status" hidden>秋山正在浮現……</p><div id="views"><button id="scene-replay" hidden>再看景物</button><button data-view="poet">看杜牧</button><button data-view="wide">看全景</button><button data-view="angle">換個角度</button><button data-zoom="0.8" aria-label="放大景物">＋</button><button data-zoom="1.25" aria-label="縮小景物">−</button></div><small>拖曳看景・雙指縮放</small></div></section><aside id="reveal-banner" aria-label="新景物出現" hidden><p id="reveal-title" role="status"></p><p id="reveal-detail"></p><p id="reveal-quote"></p><button id="reveal-continue" type="button">看到了，繼續</button></aside><section id="panel" aria-label="故事與尋憶任務" hidden></section><button id="task-toggle" class="task-toggle" type="button" aria-controls="panel" aria-expanded="true" hidden>收起任務 ▾</button></main>
<footer><span id="save-status" role="status">記憶與手記儲存於這部裝置</span><button id="reset">重新尋憶</button></footer>
<dialog id="verse-screen" aria-labelledby="verse-title"><div class="verse-content"><p class="verse-kicker">山行 · 杜牧</p><h2 id="verse-title"></h2><button id="enter-verse" type="button">走入詩句 <span aria-hidden="true">→</span></button></div></dialog><dialog id="modal"><button id="close-modal" class="close" aria-label="關閉">×</button><div id="modal-content"></div></dialog><script type="module" src="./ruhua/app.mjs?v=20261119-student-flow"></script></body></html>
